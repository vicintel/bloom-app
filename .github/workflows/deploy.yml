name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APPB/MYAPPS/Bloom_app/bloom_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable   # Bloom needs Dart 3.10.8+, newer than Flutter 3.24 ships
          cache: true

      # The web build is public: anything bundled into it can be downloaded by anyone.
      # So the AI key is NOT put in here; the web demo runs without AI replies.
      - name: Create an empty .env (the app lists it as an asset)
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/bloom-app/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: APPB/MYAPPS/Bloom_app/bloom_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
